<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>搬字大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--fg:#2b2118;--card:#fff;--line:#e5d3b8;--acc:#e8743b;--muted:#8a7660;--pad:clamp(72px,13vmin,150px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--fg:#f5ead8;--card:#2a231a;--line:#4a3d2c;--muted:#b09c80}}
:root[data-theme="dark"]{--bg:#1d1812;--fg:#f5ead8;--card:#2a231a;--line:#4a3d2c;--muted:#b09c80}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
h1{font-size:1.5rem;margin:4px 0 10px;text-align:center}
.card{max-width:640px;margin:16px auto;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px}
label{display:block;font-size:.9rem;color:var(--muted);margin:12px 0 4px}
select,textarea,input[type=number],input[type=text]{width:100%;font:inherit;padding:8px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{height:130px;font-size:.85rem}
.chk{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:1rem}
.chk input{width:auto}
button{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 18px;cursor:pointer}
.row{display:flex;gap:8px;justify-content:center;margin-top:14px}
.hide{display:none!important}
.small{font-size:.85rem;color:var(--muted);line-height:1.6}
.big{font-size:3rem;text-align:center}
.modes{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
body.solo .rk{display:none!important}
.mode{background:var(--bg);color:var(--fg);border:3px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:14px}
.mode b{font-size:1.15rem}.mode span{font-size:.82rem;color:var(--muted);line-height:1.5}
.mode.on{border-color:var(--acc);background:rgba(232,116,59,.13)}
.pn,.pa,.ph{display:grid;gap:8px;align-items:center;margin-top:8px}
.pn{grid-template-columns:46px 1fr 96px}
.pn select{padding:6px;font-size:.95rem}
.pn input{font-size:1.1rem}
.pa,.ph{grid-template-columns:36px 1fr}
body.race .pa,body.race .ph{grid-template-columns:36px 1fr}
.ph{font-size:.8rem;color:var(--muted)}
.pa select,.pa input{padding:6px;font-size:.9rem}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(128,128,128,.12)}.av .ic{width:32px;height:32px}
.ic{width:1.5em;height:1.5em;vertical-align:middle}.lab .ic{width:1.7rem;height:1.7rem}.hint b .ic{width:1.3em;height:1.3em;vertical-align:-.25em}
.raceonly{display:none}body.race .raceonly{display:block}
.res{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:1.15rem}
#play{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:6px 14px 2px}
.top .l{font-size:clamp(1.3rem,4.5vmin,2.6rem);font-weight:700;font-variant-numeric:tabular-nums}
.top .r{text-align:right;font-size:clamp(1rem,3vmin,1.6rem)}
.q{text-align:center;font-size:clamp(1rem,3.4vmin,1.9rem);font-weight:700}
.hint{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;font-size:clamp(.82rem,2.3vmin,1.15rem);padding:0 10px 2px}
.hc{display:inline-flex;align-items:center;gap:6px;background:rgba(128,128,128,.14);border-radius:12px;padding:3px 10px}
#play.calm .hint{font-size:clamp(.9rem,2.5vmin,1.25rem)}
body.race .cooponly{display:none}
.hint b{color:#fff;background:#e8a400;border-radius:50%;display:inline-block;min-width:1.4em;text-align:center}
#stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);gap:8px;padding:0 10px 8px}
#mapwrap{min-width:0;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;border-radius:12px}
.pads{display:flex;flex-direction:row;justify-content:space-around;align-items:flex-end;gap:6px}
.pad{width:var(--pad);height:var(--pad);border:5px solid;border-radius:50%;position:relative;touch-action:none;background:rgba(128,128,128,.15)}
.knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;opacity:.9}
.lab{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:1.3rem;pointer-events:none}
.pw{display:flex;flex-direction:row;align-items:flex-end;gap:8px}
.abtn{width:calc(var(--pad)*.78);height:calc(var(--pad)*.78);border:4px solid;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;line-height:1.2;background:rgba(128,128,128,.2);touch-action:none;font-size:clamp(.85rem,2.2vmin,1.2rem)}
.abtn:active{background:rgba(232,116,59,.5)}
@media (orientation:portrait){.pw{flex-direction:column;align-items:center}.abtn{width:var(--pad);height:auto;border-radius:14px;padding:8px 0}}
details{margin-top:12px;border:2px solid var(--line);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:6px}
.mode{padding:16px 18px}.mode b{font-size:1.3rem}.mode span{font-size:.95rem}
#setup{font-size:1.05rem}
#mid{flex:1;min-height:0;display:flex;flex-direction:column}
#padBar{flex:0 0 auto;padding:0 10px 8px}
#play.nopads .pads{display:none}
#stage{min-width:0}
@media (orientation:landscape){
  :root{--pad:clamp(56px,9vmin,110px)}
  #mid{flex-direction:row}
  .hint{flex:0 0 clamp(140px,13vw,210px);flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;align-content:flex-start;gap:8px;padding:6px 6px 6px 10px;font-size:clamp(.8rem,1.9vmin,1.1rem);overflow:auto}
  #play.calm .hint{font-size:clamp(.85rem,2vmin,1.15rem)}
  .hint .hc{display:flex;align-items:flex-start;gap:8px;text-align:left}
}
/* ---- art pass ---- */
:root{--acc:#ff7a45;--card:#fffdf8;--line:#ecd9bd}
body{background:radial-gradient(900px 520px at 12% -8%,#ffe0b0 0,transparent 62%),radial-gradient(800px 520px at 100% 0,#cdeaff 0,transparent 58%),var(--bg);min-height:100vh}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#2a231a}body{background:radial-gradient(900px 520px at 12% -8%,#43301b 0,transparent 62%),radial-gradient(800px 520px at 100% 0,#1c3550 0,transparent 58%),var(--bg)}}
.card{border:0;border-radius:24px;box-shadow:0 12px 34px rgba(140,80,20,.16)}
.title{font-size:2.1rem;font-weight:900;letter-spacing:.08em;margin:6px 0 2px;background:linear-gradient(90deg,#ff7a45,#ff3d8b 55%,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.parade{display:flex;justify-content:center;gap:8px;margin:2px 0 8px}
.parade .ic{width:56px;height:56px;animation:hop 1.8s ease-in-out infinite}
.parade .ic:nth-child(2){animation-delay:.15s}.parade .ic:nth-child(3){animation-delay:.3s}.parade .ic:nth-child(4){animation-delay:.45s}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.parade .ic{animation:none}}
button{background:linear-gradient(#ff9a63,#ff6b3a);border-radius:14px;font-weight:700;box-shadow:0 4px 0 #c9501f,0 8px 16px rgba(201,80,31,.28);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c9501f}
button.sec{background:linear-gradient(#a9a9b3,#8b8b97);box-shadow:0 4px 0 #62626d}
button.sec:active{box-shadow:0 1px 0 #62626d}
#start,#replay{background:linear-gradient(#45d695,#1faf6f);box-shadow:0 5px 0 #138a55,0 10px 20px rgba(19,138,85,.3)}
#start:active,#replay:active{box-shadow:0 2px 0 #138a55}
.mode{border:0;border-left:10px solid var(--acc);background:var(--card);color:var(--fg);box-shadow:0 6px 16px rgba(120,80,30,.14);transition:transform .12s;text-align:left}
.mode:hover{transform:translateY(-2px)}
.mode:active{transform:translateY(1px)}
.mode[data-m=coop]{border-left-color:#ff7a45}.mode[data-m=race]{border-left-color:#3d8bff}.mode[data-m=solo]{border-left-color:#9a5cff}.mode[data-m=potluck]{border-left-color:#2fb36d}.mode[data-m=relay]{border-left-color:#e8b923}
.mode b{display:flex;align-items:center;gap:10px;font-size:1.35rem;color:var(--fg)}
.mi{display:inline-flex}.mi .ic{width:38px;height:38px;margin-right:-8px}
details{background:rgba(128,128,128,.06);border:1px solid var(--line);border-radius:16px}
input[type=text],select,textarea,input[type=number]{border:2px solid var(--line);border-radius:12px;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(255,122,69,.35);border-color:var(--acc)}
.res{border-radius:12px;padding:10px 12px;border-bottom:0;margin-top:4px}
.res:nth-child(odd){background:rgba(128,128,128,.08)}
.big.parade .ic{width:76px;height:76px}
#play{color:#f4f6ff;background:radial-gradient(1200px 700px at 50% -20%,#33447f 0,#1a2140 55%,#10142a 100%)}
.top{margin:8px 10px 0;padding:6px 12px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.top .l{display:flex;align-items:center;gap:8px}
.top .l svg,.pill svg{width:1em;height:1em;flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 12px;margin-right:6px;font-weight:700}
.q{background:rgba(255,255,255,.1);border-radius:999px;padding:4px 18px;justify-self:center;color:#fff}
.ib{padding:6px 12px!important;background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.28);box-shadow:none!important;border-radius:12px;font-size:clamp(.78rem,1.9vmin,1rem);font-weight:700;color:#fff}
.ib:active{transform:none;background:rgba(255,255,255,.32)!important}
.hc{background:#fff7e6;color:#3b2a1d;border-radius:16px;padding:6px 12px;box-shadow:0 3px 10px rgba(0,0,0,.28);font-weight:700}
.hint b{display:inline-flex;align-items:center;justify-content:center;min-width:1.8em;height:1.8em;line-height:1;flex:0 0 auto;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pad{background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.3),rgba(255,255,255,.06) 70%);box-shadow:0 6px 14px rgba(0,0,0,.4),inset 0 0 20px rgba(255,255,255,.1)}
.pad::after{content:'';position:absolute;inset:17%;border:2px dashed rgba(255,255,255,.28);border-radius:50%;pointer-events:none}
.knob{opacity:1;background-image:radial-gradient(circle at 35% 28%,rgba(255,255,255,.65),rgba(255,255,255,0) 58%);box-shadow:0 4px 9px rgba(0,0,0,.45),inset 0 -4px 8px rgba(0,0,0,.25)}
.abtn{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.4),rgba(255,255,255,.06) 62%);box-shadow:0 5px 12px rgba(0,0,0,.4)}
.abtn:active{transform:scale(.94);background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.7),rgba(255,255,255,.2) 62%)}
/* ---- controls at mid-height on both sides (6th graders reach the middle best) ---- */
.hint{flex:0 0 auto!important;flex-direction:row!important;flex-wrap:wrap!important;justify-content:center!important;align-content:flex-start!important;overflow:visible!important;gap:4px 8px!important;padding:2px 10px!important;font-size:clamp(.8rem,2vmin,1.05rem)!important}
#play.calm .hint{font-size:clamp(.85rem,2.1vmin,1.1rem)!important}
.hint .hc{display:inline-flex!important;align-items:center!important}
#padBar{display:none!important}
.pw{display:flex;flex-direction:row;align-items:center;gap:8px}
@media (orientation:landscape){
  :root{--pad:clamp(60px,10.5vmin,120px)}
  #mid{display:flex!important;flex-direction:row!important;align-items:stretch}
  #stage{flex:1;min-width:0}
  .pads.side{flex:0 0 clamp(165px,15vw,230px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:0 6px}
}
@media (orientation:portrait){
  #mid{display:grid!important;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) auto}
  #stage{grid-column:1/3;grid-row:1}
  #padL{grid-column:1;grid-row:2}#padR{grid-column:2;grid-row:2}
  .pads.side{display:flex;flex-direction:row;justify-content:space-around;align-items:flex-end;padding:0 6px 8px}
}
#play.nopads .pads{display:none!important}
@media (orientation:landscape){
  #play.pp-low .pads.side{transform:translateY(13vh)}
  #play.pp-bottom .pads.side{justify-content:flex-end!important;padding-bottom:10px}
}
#play.ps-m{--pad:clamp(60px,10.5vmin,120px)}
#play.ps-l{--pad:clamp(80px,14vmin,170px)}
#play.ps-xl{--pad:clamp(100px,18vmin,215px)}
@media (orientation:landscape){
  #play[class*="ps-"] .pads.side{flex:0 0 calc(var(--pad)*1.9 + 28px)!important}
}
/* ---- top gap, floating menu, no page scroll while playing ---- */
:root{--topgap:0px}
#play{padding-top:var(--topgap)!important;position:relative}
#setup,#end{margin-top:calc(16px + var(--topgap))}
html.playing,html.playing body{overflow:hidden}
#fm{position:absolute;left:10px;bottom:10px;z-index:30;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
#fmp{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:14px;background:rgba(16,20,42,.94);border:1px solid rgba(255,255,255,.22)}
#fmp .ib{width:100%;text-align:center}
.gapctl{display:flex;align-items:center;gap:6px;color:#fff;font-size:.85rem}
.gapctl .ib{width:auto!important;padding:4px 12px!important}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:700;cursor:pointer}
.fchip input{width:auto;margin:0}
</style>
</head>
<body>
<section id="setup" class="card">
  <div id="s1">
    <h1 class="title">搬字大冒險</h1>
    <div class="parade" id="parade"></div>
    <p class="small" style="text-align:center;margin:0">第九課〈空城計〉字音字形小偵探</p>
    <div class="modes">
      <button class="mode" data-m="potluck"><b><span class="mi" data-ic="0,1,2,3"></span>暖身模式</b><span>場上同一個字族，一次一題。學生輪流上台，從字族裡找出正確的字放進去。適合第一次玩的暖身。</span></button>
      <button class="mode" data-m="relay"><b><span class="mi" data-ic="0,1"></span>接力模式</b><span>A、B 兩隊輪流上場，同一時間只有一位同學操作。每位同學負責一題，答對換另一隊的下一位。兩隊各自計時，搬錯罰 5 秒，比哪一隊用時較短。</span></button>
      <button class="mode" data-m="coop"><b><span class="mi" data-ic="0,1,2"></span>團體合作</b><span>全隊一起。每回合有「人數」個目的地各一題，分工搬運，看全隊總共用多久。</span></button>
      <button class="mode" data-m="race"><b><span class="mi" data-ic="3,1"></span>個人競速</b><span>每人有自己的題目和目的地，只能搬自己顏色的字，比誰先完成，也可以只跟自己的紀錄比。</span></button>
      <button class="mode" data-m="solo"><b><span class="mi" data-ic="2"></span>個人模式</b><span>一個人完成。簡單：題目固定在上、選項固定在下，地圖單純。困難：地圖複雜，字散落各處。</span></button>
    </div>
  </div>

  <div id="s2" class="hide">
    <div class="row" style="justify-content:space-between;align-items:center;margin:0 0 4px"><button id="back" class="sec">← 換玩法</button><b id="mname" style="font-size:1.25rem"></b></div>

    <div id="npwrap"><label>玩家人數</label><select id="np"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></div>
    <div id="plwrap"><label>玩家（名字與輔助）</label>
    <div id="prow"></div>
    <p class="small" id="easyhelp"></p></div>
    <div id="soloopts" class="hide"><label>回合數（每回合 4 題，隨機出）</label><select id="sround"><option value="1">1 回合</option><option value="2">2 回合</option><option value="3" selected>3 回合</option><option value="4">4 回合</option><option value="5">5 回合</option><option value="6">6 回合</option><option value="7">7 回合</option><option value="99">全部題目都玩一遍</option></select>
    <label class="chk"><input type="checkbox" id="spair" checked> 簡單：鑰匙和寶箱再用同一個顏色配對</label></div>
    <div id="rosterwrap" class="hide"><label id="potlab">題數（從題庫隨機抽）</label><input type="number" id="potn" min="1" value="10"><p class="small" id="potinfo"></p>
    <label id="rlab">上台名單（每行一位同學，可以留空）</label><textarea id="roster" rows="4" placeholder="小明&#10;小華&#10;小美">丹寧&#10;志鴻&#10;昱婕</textarea>
    <div id="r2wrap" class="hide"><label>B 隊名單（每行一位同學，可以留空）</label><textarea id="roster2" rows="4" placeholder="小強&#10;小玲&#10;小安"></textarea></div>
    <p class="small">留空的話，名字會顯示「上台同學」。卡住時，遊戲中右上角可以按「換人」。</p></div>

    <div id="famsel"></div>
    <p class="small" id="info" style="text-align:center;margin-top:12px"></p>
    <div class="row"><button id="start" style="font-size:1.3rem;padding:14px 44px">開始遊戲</button></div>

    <details id="more"><summary>更多設定</summary>
      <p class="small" style="margin:10px 0 0"><b>遊戲</b></p>
      <label>達標線（第一次就搬對的比例）</label>
      <select id="thr"><option value="60">60%</option><option value="70">70%</option><option value="80" selected>80%</option><option value="90">90%</option></select>
      <label class="chk" style="margin-top:12px"><input type="checkbox" id="calm" checked> 🌿 清爽畫面（題目在地圖外、字放大、少動畫）</label>
      <label class="chk"><input type="checkbox" id="read"> 🔊 出新題時自動朗讀提示</label>
      <div class="cooponly"><label>團體合作：每回合最多幾題（字族的詞比較多時，會拆成兩個回合）</label><select id="perq"><option value="2">2 題</option><option value="3">3 題</option><option value="4" selected>4 題</option><option value="5">5 題</option><option value="6">6 題</option></select></div>
      <label class="chk raceonly rk" id="rankwrap"><input type="checkbox" id="rank" checked> 結算時顯示名次（取消就只顯示各自的時間）</label>

      <p class="small" style="margin:16px 0 0"><b>實驗功能（beta）</b></p>
      <label class="chk"><input type="checkbox" id="flee" checked> 🧪 會逃跑的字：玩家靠近時，場上的字會跑開</label>
      <div id="fleeopt"><label>逃跑速度</label><select id="fleeSpd"><option value="1.8">慢</option><option value="2.6" selected>中</option><option value="3.4">快</option></select>
      <p class="small">每個字的速度隨機不同（這裡選的是平均速度）；字會繞著柱子和牆邊躲；開「簡單」輔助的玩家不會被躲開。走路速度建議 4.4 以上。</p></div>

      <p class="small" style="margin:16px 0 0"><b>操作與畫面</b></p>
      <label>走路速度（每秒走幾格）</label>
      <select id="bspd"><option value="3.4">原本（3.4）</option><option value="4.4" selected>加 1（4.4）</option><option value="5.4">加 2（5.4）</option></select>
      <div id="padwrap"><div class="ph"><span></span><span>各玩家移動速度</span></div>

  let best=null,bd=.8;

function makePlan(bank,per,R,exam,minQ){

    const k=Math.ceil(seq.length/per),base=Math.floor(seq.length/k),extra=seq.length%k,out=[];
    let i=0;
    for(let r=0;r<k;r++){const sz=base+(r<extra?1:0),qs=seq.slice(i,i+sz);i+=sz;const grps=[...new Set(qs.map(q=>q.grp))];out.push({grps,qs,grp:grps.join('＋')})}
    return out;
  }
  const chunks=[];
  shuffle(Object.keys(gm)).forEach(g=>{
    const qs=shuffle(gm[g]);
    if(exam){const k=Math.ceil(qs.length/per),sz=Math.ceil(qs.length/k);for(let i=0;i<qs.length;i+=sz)chunks.push({grp:g,qs:qs.slice(i,i+sz)})}

  while(chunks.length){
    const c=chunks.shift(),r={grps:[c.grp],qs:c.qs.slice()};
    while(r.qs.length<need&&chunks.length){
      const nx=chunks[0],room=per-r.qs.length;if(room<=0)break;
      const take=nx.qs.slice(0,room);r.qs.push(...take);if(!r.grps.includes(nx.grp))r.grps.push(nx.grp);

const PTR=new Map();
function clientToGrid(cx,cy){
  const r=cv.getBoundingClientRect(),sc=Math.min(r.width/cv.width,r.height/cv.height);
  const ox=(r.width-cv.width*sc)/2,oy=(r.height-cv.height*sc)/2;
  const FW=G.div?COLS*T+2*T:COLS*T,K=cv.width/FW,M=G.div?T:0;
  return {x:((cx-r.left-ox)/sc/K-M)/T,y:((cy-r.top-oy)/sc/K-M)/T};
}
function tapTarget(g,p){
  if(p.carry&&(Math.hypot(g.x-p.x,g.y-p.y)<.8||Math.hypot(g.x-(p.x-.32),g.y-(p.y-1))<.6))return {kind:'drop'};
  if(p.carry){
    let best=null,bd=9;
    for(const d of G.dests){
      if(d.done||(d.owner!=null&&d.owner!==p.i))continue;
      const e=d.ex!=null?EXITS[d.ex]:null,cx=d.x+(e?e.ox:0),cy=d.y+(e?e.oy:0),vert=e&&(e.side==='L'||e.side==='R');
      const dx=Math.abs(g.x-cx),dy=Math.abs(g.y-cy);
      if(vert?(dx<.6&&dy<1.3):(dx<1.1&&dy<.75)){const dd=Math.hypot(dx,dy);if(dd<bd){bd=dd;best=d}}
    }
    if(best)return {kind:'dest',d:best};
  }
  let bi=null,bd=1e9;
  for(const it of G.items){
    if(it.cool>0||(it.owner!=null&&it.owner!==p.i))continue;
    const dd=Math.min(Math.hypot(g.x-it.x,g.y-it.y),Math.hypot(g.x-(it.x+.85),g.y-(it.y-.15)));
    if(dd<.65&&dd<bd){bd=dd;bi=it}
  }
  return bi?{kind:'item',it:bi}:null;
}
function autoPoint(a){
  if(a.kind==='item')return G.items.includes(a.it)?{x:a.it.x,y:a.it.y}:null;
  const d=a.d;if(d.done||!G.dests.includes(d))return null;
  const e=d.ex!=null?EXITS[d.ex]:null;return {x:e?e.px:d.x,y:e?e.py:d.y};
}
function pathNext(p,tx,ty){
  const sx=Math.floor(p.x),sy=Math.floor(p.y),gx=Math.floor(tx),gy=Math.floor(ty);
  if(sx===gx&&sy===gy)return {x:tx,y:ty};
  const W=COLS+3,id=(x,y)=>(y+1)*W+(x+1),prev=new Map([[id(sx,sy),null]]),q=[[sx,sy]];
  let found=false;
  for(let h=0;h<q.length&&!found;h++){
    const [x,y]=q[h];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx<-1||ny<-1||nx>COLS||ny>ROWS)continue;
      const k=id(nx,ny);if(prev.has(k))continue;
      if(solid(nx+.5,ny+.5)&&!(nx===gx&&ny===gy))continue;
      prev.set(k,[x,y]);q.push([nx,ny]);
      if(nx===gx&&ny===gy){found=true;break}
    }
  }
  if(!found)return {x:tx,y:ty};
  let cur=[gx,gy];
  while(true){const pv=prev.get(id(cur[0],cur[1]));if(!pv||(pv[0]===sx&&pv[1]===sy))break;cur=pv}
  return {x:cur[0]+.5,y:cur[1]+.5};
}
function doAuto(p,dt){
  const a=p.auto,pt=a&&autoPoint(a);
  if(!pt||(a.kind==='dest'&&!p.carry)){p.auto=null;p.tgt=null;return}
  const dist=Math.hypot(pt.x-p.x,pt.y-p.y);
  if(a.kind==='item'&&dist<.7){
    const it=a.it;
    if(p.carry){const o=p.carry,oc=p.carryCol;p.carry=it.c;p.carryCol=it.col;it.c=o;it.col=oc;it.cool=1}
    else{p.carry=it.c;p.carryCol=it.col;G.items=G.items.filter(z=>z!==it)}
    p.auto=null;p.tgt=null;return;
  }
  if(a.kind==='dest'&&inDeliver(p,a.d)){const d=a.d;p.auto=null;p.tgt=null;deliver(p,d);return}
  a.age=(a.age||0)+dt;
  if(a.age>1){if(a.lastD!=null&&dist>a.lastD-.2){p.auto=null;p.tgt=null;return}a.lastD=dist;a.age=0}
}
cv.addEventListener('pointerdown',e=>{
  if(G&&G.hold&&!G.over&&!G.paused){G.hold=null;e.preventDefault();return}
  if(!G||G.over||G.paused||!(G.potluck||G.solo))return;
  const g=clientToGrid(e.clientX,e.clientY),taken=[...PTR.values()].map(v=>v.p);
  let best=null,bd=2.5;
  for(const p of G.players){
    if(p.done)continue;
    if(G.potluck||G.solo){best=p;break}
    if(taken.includes(p))continue;
    const d=Math.hypot(p.x-g.x,p.y-g.y);if(d<bd){best=p;bd=d}
  }
  if(!best)return;
  best.auto=null;
  PTR.set(e.pointerId,{p:best,tap:tapTarget(g,best),sx:g.x,sy:g.y,moved:false,t0:performance.now()});
  best.tgt=g;try{cv.setPointerCapture(e.pointerId)}catch(err){}e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  const ent=PTR.get(e.pointerId);if(!ent||!G)return;
  const g=clientToGrid(e.clientX,e.clientY);ent.p.tgt=g;
  if(Math.hypot(g.x-ent.sx,g.y-ent.sy)>.5)ent.moved=true;
});
const relPtr=e=>{
  const ent=PTR.get(e.pointerId);if(!ent)return;
  const p=ent.p;
  if(ent.tap&&!ent.moved&&performance.now()-ent.t0<700){if(ent.tap.kind==='drop'){dropHere(p);p.tgt=null}else{p.auto=ent.tap;p.tgt=null}}
  else p.tgt=null;
  PTR.delete(e.pointerId);
};
cv.addEventListener('pointerup',relPtr);cv.addEventListener('pointercancel',relPtr);
