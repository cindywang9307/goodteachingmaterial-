<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課堂小遊戲</title>
<style>
:root{
  --bg:#fbf8f1; --ink:#2b2a33; --muted:#6b6878;
  --c1:#e4572e; --c2:#2e86ab; --c3:#f2a900; --c4:#3a9d6e;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1d1c24; --ink:#f3f0e8; --muted:#aaa6b8;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  line-height:1.6; min-height:100vh;
  padding:max(24px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));
}
main{max-width:860px; margin:0 auto}
h1{font-size:clamp(2rem,6vw,3.2rem); margin:24px 0 4px; letter-spacing:.04em}
.sub{margin:0 0 32px; color:var(--muted); font-size:1.05rem}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:18px}
.game{
  display:flex; gap:16px; align-items:center;
  padding:20px; border-radius:20px; text-decoration:none; color:#fff;
  background:var(--c); min-height:128px;
  transition:transform .15s ease;
}
.game:hover,.game:focus-visible{transform:translateY(-4px) rotate(-.6deg)}
.game:focus-visible{outline:4px solid var(--ink); outline-offset:3px}
.glyph{
  flex:none; width:68px; height:68px; display:grid; place-items:center;
  background:rgba(255,255,255,.95); color:var(--c);
  border-radius:14px; font-size:2.4rem; font-weight:900;
}
.game h2{margin:0; font-size:1.35rem}
.game p{margin:2px 0 0; font-size:.95rem; opacity:.95}
.g1{--c:var(--c1)} .g2{--c:var(--c2)} .g3{--c:#b87d00} .g4{--c:var(--c4)}
footer{margin-top:36px; color:var(--muted); font-size:.9rem}
@media (prefers-reduced-motion:reduce){.game{transition:none}}
</style>
</head>
<body>
<main>
  <h1>課堂小遊戲</h1>
  <p class="sub">選一個遊戲，點下去就能開始玩。</p>

  <div class="grid">
    <a class="game g1" href="char-game/char-game.html">
      <span class="glyph" aria-hidden="true">字</span>
      <span><h2>搬字大冒險</h2><p>把相似的漢字搬到正確的位置</p></span>
    </a>
    <a class="game g2" href="memory-match/">
      <span class="glyph" aria-hidden="true">牌</span>
      <span><h2>翻牌對對碰</h2><p>翻開卡片，找出配對的一組</p></span>
    </a>
    <a class="game g3" href="pacman/">
      <span class="glyph" aria-hidden="true">情</span>
      <span><h2>情緒調節小精靈</h2><p>在迷宮裡吃豆子，回答情緒問題</p></span>
    </a>
    <a class="game g4" href="pipe-game/">
      <span class="glyph" aria-hidden="true">水</span>
      <span><h2>接水管</h2><p>轉動水管，讓水從頭流到尾</p></span>
    </a>
  </div>

  <footer>建議使用電腦或平板的瀏覽器遊玩。</footer>
</main>
</body>
</html>
