<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>課堂小遊戲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f0dc; --rule:#e2d6b3; --paper:#fffaf0; --ink:#26242e; --muted:#6a6578;
  --board:#2c5a4b; --board-in:#224739; --wood:#c08a52; --wood-d:#94652f;
  --chalk:#f8f6ee; --ch-y:#ffd95a; --ch-p:#ff9fb8; --ch-b:#8fd3f4; --ch-g:#a9e6a3;
  --c1:#e4572e; --c2:#2e86ab; --c3:#a66c00; --c4:#2f8c5f;
  --sticky:#ffe27a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1d1c24; --rule:#2a2934; --paper:#2a2933; --ink:#f3f0e8; --muted:#aaa6b8; --sticky:#c9a93a}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{
  background:var(--bg) repeating-linear-gradient(transparent 0 35px,var(--rule) 35px 36px);
  color:var(--ink);
  font-family:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-weight:500; line-height:1.6; min-height:100vh;
  padding:max(24px,env(safe-area-inset-top)) 20px max(40px,env(safe-area-inset-bottom));
}
main{max-width:1060px; margin:0 auto}

/* ── 黑板 ── */
.board{
  position:relative; text-align:center; overflow:hidden;
  padding:clamp(36px,7vw,64px) 20px clamp(40px,7vw,64px);
  background:
    radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.07),transparent 60%),
    var(--board);
  color:var(--chalk);
  border:14px solid var(--wood); border-radius:20px;
  box-shadow:inset 0 0 0 3px var(--board-in), 0 8px 0 var(--wood-d), 0 8px 0 3px var(--ink);
  outline:3px solid var(--ink); outline-offset:-0px;
  margin-bottom:56px;
}
.board::after{ /* 粉筆槽與粉筆 */
  content:""; position:absolute; left:6%; right:6%; bottom:0; height:12px;
  background:var(--wood-d);
}
.chalk{position:absolute; bottom:12px; height:9px; border-radius:3px}
.chalk.a{left:12%; width:44px; background:var(--ch-y); transform:rotate(-2deg)}
.chalk.b{left:calc(12% + 54px); width:30px; background:var(--ch-p); transform:rotate(3deg)}
.doodle{position:absolute; pointer-events:none; opacity:.9}
.d1{top:16px; left:18px; width:54px; transform:rotate(-12deg)}
.d2{top:22px; right:20px; width:60px; transform:rotate(10deg)}
.d3{bottom:34px; right:8%; width:70px}
h1{
  margin:0; font-weight:900; line-height:1.1;
  font-size:clamp(3.4rem,13vw,7rem); letter-spacing:.06em;
  text-shadow:3px 3px 0 rgba(0,0,0,.28);
}
h1 span:nth-child(1){color:var(--ch-y)}
h1 span:nth-child(2){color:var(--chalk)}
h1 span:nth-child(3){color:var(--ch-p)}
h1 span:nth-child(4){color:var(--ch-b)}
h1 span:nth-child(5){color:var(--ch-g)}
.under{display:block; width:min(440px,80%); height:22px; margin:6px auto 12px; overflow:visible}
.under path{
  fill:none; stroke:var(--chalk); stroke-width:4; stroke-linecap:round;
  stroke-dasharray:520; stroke-dashoffset:520; animation:draw 1.1s .25s ease-out forwards;
}
@keyframes draw{to{stroke-dashoffset:0}}
.sub{margin:0; color:#d6e7df; font-size:clamp(1.05rem,3vw,1.35rem)}

/* ── 版面 ── */
.layout{display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:40px; align-items:start}
.side{position:sticky; top:20px}
.note{
  position:relative; background:var(--sticky); color:#2b2a33;
  border:3px solid var(--ink); border-radius:6px 6px 22px 6px;
  padding:26px 16px 18px; box-shadow:6px 6px 0 var(--ink);
  transform:rotate(1.2deg);
}
.note::before{ /* 膠帶 */
  content:""; position:absolute; top:-14px; left:50%; width:80px; height:24px;
  background:rgba(255,255,255,.65); border:1px solid rgba(0,0,0,.12);
  transform:translateX(-50%) rotate(-3deg);
}
.note h2{margin:0 6px 8px; font-size:1.15rem; font-weight:800}
.note ul{list-style:none; margin:0; padding:0}
.note li+li{border-top:2px dashed rgba(43,42,51,.35)}
.note a{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:11px 8px; color:inherit; text-decoration:none; font-weight:800; font-size:1.1rem;
  border-radius:8px;
}
.note a:hover{background:rgba(255,255,255,.45)}
.note a:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.note .n{
  flex:none; width:28px; height:28px; display:grid; place-items:center;
  border-radius:50%; background:var(--ink); color:var(--sticky); font-size:.9rem;
}

/* ── 分類 ── */
.cat{margin:0 0 52px; scroll-margin-top:24px}
.cat-title{
  display:inline-block; margin:0 0 22px; padding:4px 22px 6px;
  font-size:1.6rem; font-weight:900; color:#fff; background:var(--c);
  border:3px solid var(--ink); border-radius:999px; box-shadow:4px 4px 0 var(--ink);
  transform:rotate(-1.5deg);
}
#strategy{--c:var(--c2)} #social{--c:var(--c1)} #others{--c:var(--c4)}

.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:30px 24px; padding-top:6px}
.game{
  position:relative; display:flex; gap:16px; align-items:center;
  padding:22px 20px; min-height:136px; border-radius:26px;
  background:var(--c); color:#fff; text-decoration:none;
  border:3px solid var(--ink); box-shadow:7px 7px 0 var(--ink);
  transition:transform .15s ease, box-shadow .15s ease;
}
.game::before{ /* 膠帶 */
  content:""; position:absolute; top:-14px; left:50%; width:74px; height:24px;
  background:rgba(255,244,190,.85); border:1px solid rgba(0,0,0,.15);
  transform:translateX(-50%) rotate(-4deg);
}
.grid .game:nth-child(odd){transform:rotate(-1.2deg)}
.grid .game:nth-child(even){transform:rotate(1.2deg)}
.grid .game:nth-child(even)::before{transform:translateX(-50%) rotate(3deg)}
.game:hover,.game:focus-visible{transform:rotate(0) translate(-3px,-3px); box-shadow:11px 11px 0 var(--ink)}
.game:active{transform:rotate(0) translate(4px,4px); box-shadow:3px 3px 0 var(--ink)}
.game:focus-visible{outline:4px solid var(--ch-b); outline-offset:4px}

/* 田字格 */
.glyph{
  flex:none; width:76px; height:76px; display:grid; place-items:center;
  background:
    linear-gradient(to right,transparent calc(50% - 1px),rgba(228,87,46,.35) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),
    linear-gradient(to bottom,transparent calc(50% - 1px),rgba(228,87,46,.35) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),
    #fffdf6;
  color:var(--ink); border:3px solid var(--ink); border-radius:10px;
  font-size:2.6rem; font-weight:900; line-height:1;
}
.game h2{margin:0; font-size:1.4rem; font-weight:900; line-height:1.3}
.game p{margin:4px 0 0; font-size:.98rem; line-height:1.45}
.g1{--c:var(--c1)} .g2{--c:var(--c2)} .g3{--c:var(--c3)} .g4{--c:var(--c4)}
.g5{--c:#2a7a82} .g6{--c:#7b5ea7} .g7{--c:#b0455f}

footer{color:var(--muted); font-size:.95rem}

/* ── 手機 ── */
@media (max-width:760px){
  .layout{grid-template-columns:1fr; gap:34px}
  .side{position:static; order:-1}
  .note{transform:none; padding:20px 10px 10px}
  .note h2{display:none}
  .note ul{display:grid; grid-template-columns:repeat(3,1fr)}
  .note li+li{border-top:0; border-left:2px dashed rgba(43,42,51,.35)}
  .note a{flex-direction:column; text-align:center; gap:4px; padding:8px 2px; font-size:.95rem}
  .grid{grid-template-columns:1fr}
  .board{border-width:9px; margin-bottom:44px}
  .d1,.d2{width:38px}
  .d3{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .under path{animation:none; stroke-dashoffset:0}
  .game{transition:none}
}
</style>
</head>
<body>
<main>
  <header class="board">
    <svg class="doodle d1" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l4.5 11.5L37 16l-9.5 8 3 12.5L20 30l-10.5 6.5 3-12.5L3 16l12.5-1.5z" fill="none" stroke="#ffd95a" stroke-width="2.5" stroke-linejoin="round"/></svg>
    <svg class="doodle d2" viewBox="0 0 60 40" aria-hidden="true"><path d="M4 30h34M38 30l-6-6m6 6l-6 6M46 8c4 0 8 4 8 8s-4 8-8 8" fill="none" stroke="#8fd3f4" stroke-width="2.5" stroke-linecap="round"/></svg>
    <svg class="doodle d3" viewBox="0 0 70 30" aria-hidden="true"><path d="M3 22c8-14 16-14 22 0s14 14 22 0 12-10 20-4" fill="none" stroke="#ff9fb8" stroke-width="2.5" stroke-linecap="round"/></svg>
    <h1><span>課</span><span>堂</span><span>小</span><span>遊</span><span>戲</span></h1>
    <svg class="under" viewBox="0 0 440 22" preserveAspectRatio="none" aria-hidden="true"><path d="M4 14C70 4 140 18 220 10s150 6 216-2"/></svg>
    <p class="sub">選一個遊戲，點下去就能開始玩。</p>
    <span class="chalk a" aria-hidden="true"></span><span class="chalk b" aria-hidden="true"></span>
  </header>

  <div class="layout">
    <div class="content">

      <section class="cat" id="strategy" aria-labelledby="t-strategy">
        <h2 class="cat-title" id="t-strategy">學習策略</h2>
        <div class="grid">
          <a class="game g1" href="char-game/">
            <span class="glyph" aria-hidden="true">字</span>
            <span><h2>搬字大冒險</h2><p>把相似的漢字搬到正確的位置</p></span>
          </a>
          <a class="game g5" href="word-match/">
            <span class="glyph" aria-hidden="true">詞</span>
            <span><h2>語詞配對小精靈</h2><p>吃掉正確的語詞，完成配對</p></span>
          </a>
        </div>
      </section>

      <section class="cat" id="social" aria-labelledby="t-social">
        <h2 class="cat-title" id="t-social">社會技巧</h2>
        <div class="grid">
          <a class="game g3" href="pacman/">
            <span class="glyph" aria-hidden="true">情</span>
            <span><h2>情緒調節小精靈</h2><p>在迷宮裡吃豆子，回答情緒問題</p></span>
          </a>
          <a class="game g6" href="brave-hero/">
            <span class="glyph" aria-hidden="true">勇</span>
            <span><h2>勇者遊戲</h2><p>面對挑戰，做出勇敢的選擇</p></span>
          </a>
        </div>
      </section>

      <section class="cat" id="others" aria-labelledby="t-others">
        <h2 class="cat-title" id="t-others">其他小遊戲</h2>
        <div class="grid">
          <a class="game g4" href="pipe-game/">
            <span class="glyph" aria-hidden="true">水</span>
            <span><h2>接水管</h2><p>轉動水管，讓水從頭流到尾</p></span>
          </a>
          <a class="game g2" href="memory-match/">
            <span class="glyph" aria-hidden="true">牌</span>
            <span><h2>翻牌對對碰</h2><p>翻開卡片，找出配對的一組</p></span>
          </a>
          <a class="game g7" href="city-courier/">
            <span class="glyph" aria-hidden="true">遞</span>
            <span><h2>城市快遞員</h2><p>穿梭街道，把包裹準時送到</p></span>
          </a>
        </div>
      </section>

      <footer>建議使用電腦或平板的瀏覽器遊玩。</footer>
    </div>

    <aside class="side">
      <nav class="note" aria-label="遊戲分類">
        <h2>遊戲分類</h2>
        <ul>
          <li><a href="#strategy">學習策略 <span class="n">2</span></a></li>
          <li><a href="#social">社會技巧 <span class="n">2</span></a></li>
          <li><a href="#others">其他小遊戲 <span class="n">3</span></a></li>
        </ul>
      </nav>
    </aside>
  </div>
</main>
</body>
</html>
